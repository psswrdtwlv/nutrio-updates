name: Verify OTA 2026.10.23.3
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-ota-20261023-3.yml'
      - '.github/scripts/verify-ota-20261023-3.py'
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify active manifest, archive and complete catalog
        env:
          NUTRIO_VERIFY_SHA: fef21bab960c58c4b6566e0ea3d95adc30125722c58fc2378aaab8799eaa6478
          NUTRIO_VERIFY_ACTIVE: 'false'
        run: python3 .github/scripts/verify-ota-20261023-3.py
