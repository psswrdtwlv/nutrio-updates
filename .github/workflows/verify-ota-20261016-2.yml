name: Verify active OTA 2026.10.16.2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ota-20261016-2.yml']
permissions: {}
jobs:
  verify-public-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Download the public Pages archive and verify the approved candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, io, json, time, urllib.request, zipfile
          url = 'https://psswrdtwlv.github.io/nutrio-updates/nutrio-2026.10.16.2.zip'
          expected = 'b2d50ef63688d99c63a6f828e3f82cf0668a59384432477a617e583213f7e391'
          for attempt in range(18):
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      assert response.status == 200
                      assert response.url == url, 'Unexpected redirect'
                      archive = response.read(24 * 1024 * 1024 + 1)
                  assert len(archive) <= 24 * 1024 * 1024
                  assert hashlib.sha256(archive).hexdigest() == expected, 'Archive checksum mismatch'
                  break
              except Exception as error:
                  print(f'Attempt {attempt + 1}: {error}', flush=True)
                  if attempt == 17:
                      raise
                  time.sleep(10)
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              assert z.testzip() is None
              assert 'index.html' in z.namelist()
              foods_raw = z.read('offline-foods.json')
              foods = json.loads(foods_raw)
              meta = json.loads(z.read('offline-foods.meta.json'))
              assert len(foods) == meta['products'] == 114199
              assert len({row[0] for row in foods}) == 114199
              assert hashlib.sha256(foods_raw).hexdigest() == meta['sha256']
              assert hashlib.sha256(json.dumps(foods[:101221], ensure_ascii=False, separators=(',', ':')).encode()).hexdigest() == '5b496513d016c94eb3bc6000773986f5fd715038f8a50e12b435ebf095457c19'
              scripts = ''.join(z.read(n).decode() for n in z.namelist() if n.endswith('.js'))
              assert 'А что останется бесплатным?' not in scripts
              assert 'Оплата сейчас не принимается.' not in scripts
              css = ''.join(z.read(n).decode() for n in z.namelist() if n.endswith('.css'))
              assert '.foodgrid{' in css and '.foodtile{' in css
              assert '.searchfoot{position:static;' in css
              assert 'grid-template-areas:"name kcal"' in css
          manifest_url = 'https://psswrdtwlv.github.io/nutrio-updates/manifest.json'
          for attempt in range(18):
              try:
                  req = urllib.request.Request(manifest_url, headers={'Cache-Control': 'no-cache'})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      assert response.status == 200
                      assert response.url == manifest_url
                      manifest = json.loads(response.read(16385))
                  assert manifest == {'version': '2026.10.16.2', 'nativeVersion': '1', 'url': url, 'sha256': expected}, manifest
                  break
              except Exception as error:
                  print(f'Manifest attempt {attempt + 1}: {error}', flush=True)
                  if attempt == 17:
                      raise
                  time.sleep(10)
          print(json.dumps({'manifestUrl': manifest_url, 'manifestVersion': manifest['version'], 'publicManifestVerified': True}), flush=True)
          print(json.dumps({'url': url, 'http': 200, 'bytes': len(archive), 'sha256': expected,
                            'zipCRC': 'passed', 'products': len(foods), 'publicArchiveVerified': True}), flush=True)
          PY
