name: Verify OTA 2026.10.16.8
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ota-20261016-8.yml']
permissions: {}
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify published archive and catalog
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,io,json,time,urllib.request,zipfile,subprocess
          VERSION='2026.10.16.8'
          SHA='376f282f6a4ba7101420380a498dc1ff0cec4f50daec4c5c208896a1fa6f5f0a'
          URL=f'https://psswrdtwlv.github.io/nutrio-updates/nutrio-{VERSION}.zip'
          EXPECT_ACTIVE=True
          def download(url,limit):
           for attempt in range(18):
            try:
             with urllib.request.urlopen(urllib.request.Request(url,headers={'Cache-Control':'no-cache'}),timeout=25) as r:
              assert r.status==200 and r.url==url
              b=r.read(limit+1);assert len(b)<=limit
             return b
            except Exception as e:
             print('Attempt',attempt+1,str(e),flush=True)
             if attempt==17:raise
             time.sleep(10)
          archive=download(URL,24*1024*1024);assert hashlib.sha256(archive).hexdigest()==SHA
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
           assert z.testzip() is None and 'index.html' in z.namelist() and 'offline-foods.json' not in z.namelist()
           meta=json.loads(z.read('offline-foods.meta.json'));s=meta['storage'];packed=z.read(s['file'][1:])
           assert hashlib.sha256(packed).hexdigest()==s['sha256'] and len(packed)==s['bytes']
           raw=subprocess.check_output(['node','-e',"const z=require('zlib');let a=[];process.stdin.on('data',x=>a.push(x));process.stdin.on('end',()=>process.stdout.write(z.brotliDecompressSync(Buffer.concat(a))));"],input=packed)
           assert len(raw)==s['decodedBytes'] and hashlib.sha256(raw).hexdigest()==s['decodedSha256']==meta['sha256']=='345507c4fc4684fcb0481d6302ed8dd2ec0b0432c2762e55cffe6160acbb6ab1'
           foods=json.loads(raw);assert len(foods)==len({r[0] for r in foods})==meta['products']==120895
           codes=[r[3].zfill(14) for r in foods if r[3]];assert len(codes)==len(set(codes))==93473
           scripts=''.join(z.read(n).decode() for n in z.namelist() if n.endswith('.js'))
           assert 'M9.89 4.28 L10.28 2.15' in scripts,'Gear icon missing'
           assert 'А что останется бесплатным?' not in scripts
           assert 'Оплата сейчас не принимается.' not in scripts
           assert 'catalogcredits' in scripts and 'О данных и лицензиях' in scripts
           assert any(n.endswith('.wasm') for n in z.namelist()) and any('/decompress-' in n for n in z.namelist())
          if EXPECT_ACTIVE:
           expected={'version':VERSION,'nativeVersion':'1','url':URL,'sha256':SHA}
           for attempt in range(18):
            manifest=json.loads(download('https://psswrdtwlv.github.io/nutrio-updates/manifest.json',16384))
            if manifest==expected:break
            assert attempt<17,manifest
            time.sleep(10)
          print(json.dumps({'version':VERSION,'sha256':SHA,'bytes':len(archive),'products':120895,'compressedCatalog':True,'gearIcon':True,'publicArchiveVerified':True,'publicManifestVerified':EXPECT_ACTIVE}),flush=True)
          PY
